<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Begena</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Noto+Serif+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a1008;
  --wood-dark: #2c1505;
  --wood-mid: #5c2e0e;
  --wood-light: #8b4a1e;
  --leather: #7a2e0a;
  --leather-light: #a0401a;
  --gold: #c9922a;
  --gold-light: #e8b84b;
  --string-color: #d4b87a;
  --string-glow: #f0d090;
  --parchment: #f5e8c8;
  --cream: #fdf6e8;
}

body {
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  font-family: 'Playfair Display', Georgia, serif;
  user-select: none;
  overflow-x: hidden;
  padding-bottom: 40px;
}

/* ── background texture ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(100,50,10,0.18) 0%, transparent 70%),
    repeating-linear-gradient(0deg, transparent, transparent 80px, rgba(255,255,255,0.012) 80px, rgba(255,255,255,0.012) 81px);
  pointer-events: none;
}

/* ── header ── */
.header {
  text-align: center;
  padding: 28px 20px 10px;
  position: relative;
  z-index: 10;
}
.header-label {
  font-family: 'Noto Serif Ethiopic', serif;
  font-size: 13px;
  color: var(--gold);
  letter-spacing: 3px;
  margin-bottom: 6px;
  opacity: 0.85;
}
.header h1 {
  font-size: 32px;
  font-weight: 700;
  color: var(--parchment);
  letter-spacing: 1px;
}
.header h1 span { color: var(--gold-light); }

/* ── kignit selector ── */
.kignit-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 16px 20px 0;
  position: relative;
  z-index: 10;
}
.kignit-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(201,146,42,0.3);
  color: var(--gold);
  font-family: 'Playfair Display', serif;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.5px;
}
.kignit-btn:hover { background: rgba(201,146,42,0.15); border-color: var(--gold); }
.kignit-btn.active {
  background: var(--gold);
  color: var(--wood-dark);
  border-color: var(--gold-light);
  font-weight: 700;
}

/* ── instrument wrapper ── */
.instrument-wrap {
  position: relative;
  margin-top: 20px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  z-index: 5;
}

/* ── SVG canvas ── */
#begena-svg {
  width: min(420px, 95vw);
  height: auto;
  filter: drop-shadow(0 20px 60px rgba(0,0,0,0.7));
  cursor: default;
}

/* ── string hit zones ── */
.string-hit {
  cursor: pointer;
  transition: opacity 0.1s;
}
.string-hit:hover .string-line { stroke: var(--string-glow); filter: url(#glow); }

/* ── pluck animation ── */
@keyframes pluck {
  0%   { d: path(''); opacity: 1; }
  100% { opacity: 0; }
}

.vibrating {
  animation: vibrate 0.08s ease-in-out 6 alternate;
}
@keyframes vibrate {
  0%   { transform: translateX(-3px); }
  100% { transform: translateX(3px); }
}

/* ── note display ── */
.note-display {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(20, 8, 2, 0.88);
  border: 1px solid var(--gold);
  border-radius: 4px;
  padding: 10px 18px;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 20;
  min-width: 100px;
}
.note-display.show { opacity: 1; }
.note-name {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  color: var(--gold-light);
  font-weight: 700;
  line-height: 1;
}
.note-hz {
  font-size: 11px;
  color: var(--parchment);
  opacity: 0.6;
  margin-top: 3px;
  font-family: monospace;
  letter-spacing: 1px;
}
.string-num {
  font-size: 10px;
  color: var(--gold);
  opacity: 0.7;
  margin-top: 2px;
}

/* ── footer info ── */
.footer-info {
  margin-top: 20px;
  text-align: center;
  color: rgba(245,232,200,0.4);
  font-size: 12px;
  font-style: italic;
  z-index: 10;
  position: relative;
}

/* ── ripple layer ── */
.ripple-container {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 15;
}
.ripple {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232,184,75,0.35) 0%, transparent 70%);
  width: 60px; height: 60px;
  margin-left: -30px; margin-top: -30px;
  animation: rippleOut 0.6s ease-out forwards;
  pointer-events: none;
}
@keyframes rippleOut {
  0%   { transform: scale(0.3); opacity: 1; }
  100% { transform: scale(2.5); opacity: 0; }
}
</style>
</head>
<body>

  <div class="header-label">በገና • Virtual Instrument</div>
  <h1>The <span>Begena</span></h1>
</div>

  <button class="kignit-btn" data-kignit="ambasel">Ambasel</button>
  <button class="kignit-btn" data-kignit="anchiHoye">Anchi Hoye</button>
  <button class="kignit-btn" data-kignit="minorWanen">Minor Wanen</button>

<div class="instrument-wrap">

        <stop offset="70%" stop-color="#5c2e0e"/>
        <stop offset="100%" stop-color="#1a0a02"/>

      <!-- Leather soundbox gradient -->

        <stop offset="50%" stop-color="#8a3010"/>
        <stop offset="100%" stop-color="#4a1805"/>

      <!-- Crossbar gradient -->
      <linearGradient id="crossbarGrad" x1="0" x2="0" y1="0" y2="1">

        <stop offset="40%" stop-color="#c07840"/>
        <stop offset="100%" stop-color="#5c2e0e"/>

      <!-- String glow filter -->
      <filter id="strGlow" x="-20%" y="-20%" width="140%" height="140%">

        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <!-- Pluck glow -->
      <filter id="pluckGlow" x="-50%" y="-50%" width="200%" height="200%">

        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <!-- Pillar carving texture -->
      <pattern id="carvingL" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">

      </pattern>
      <!-- Leather burl pattern -->
      <filter id="burl">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="8"/>
        <feColorMatrix type="saturate" values="0"/>
        <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
        <feComposite in="blend" in2="SourceGraphic" operator="in"/>
      </filter>
    </defs>

    <!-- ══════════════════════════════════════════ -->

</div>

      { note: "E3",  hz: 164.8 },
      { note: "F3",  hz: 174.6 },

    ]

// ── String geometry: fan from crossbar to tailpiece ─────────────────────────
// 10 strings, fan out from tailpiece (centered ~170) up to crossbar (spread ~80–260)
const STRING_COUNT = 10;
const topXStart = 86, topXEnd = 254;  // crossbar spread
const botXStart = 142, botXEnd = 198; // tailpiece spread
const topY = 110, botY = 724;

function getStringX(i, isTop) {
  const t = i / (STRING_COUNT - 1);
  return isTop
    ? topXStart + t * (topXEnd - topXStart)
    : botXStart + t * (botXEnd - botXStart);
}

// ── Audio engine (Web Audio API) ─────────────────────────────────────────────
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playString(hz, stringIdx) {
  ensureAudio();
  const now = audioCtx.currentTime;
  const dur = 4.5;

  // Fundamental tone
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(hz, now);
  // Slight detuning for Begena character
  osc.detune.setValueAtTime(-8, now);

  // Birr buzz (the unique leather buzzer sound)
  const buzz = audioCtx.createOscillator();
  const buzzGain = audioCtx.createGain();
  buzz.type = 'sawtooth';
  buzz.frequency.setValueAtTime(hz * 1.005, now); // slight detuning = buzzing
  buzzGain.gain.setValueAtTime(0.06, now);
  buzzGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

  // 2nd harmonic for richness
  const harm = audioCtx.createOscillator();
  const harmGain = audioCtx.createGain();
  harm.type = 'sine';
  harm.frequency.setValueAtTime(hz * 2, now);
  harmGain.gain.setValueAtTime(0.15, now);
  harmGain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

  // Main envelope: sharp attack, long resonant decay
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.55, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.18, now + 0.5);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

  // Low-pass filter for warm Begena timbre
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(800 + hz * 2, now);
  filter.Q.setValueAtTime(2, now);

  const masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0.7, now);

  osc.connect(gain); gain.connect(filter);
  buzz.connect(buzzGain); buzzGain.connect(filter);
  harm.connect(harmGain); harmGain.connect(filter);
  filter.connect(masterGain);
  masterGain.connect(audioCtx.destination);

  osc.start(now); osc.stop(now + dur);
  buzz.start(now); buzz.stop(now + dur);
  harm.start(now); harm.stop(now + dur);
}

// ── Render strings ────────────────────────────────────────────────────────────
let activeKignit = 'selamta';
let noteTimeout = null;
const stringsGroup = document.getElementById('stringsGroup');
const pegsGroup = document.getElementById('pegsGroup');
const noteDisplay = document.getElementById('noteDisplay');
const noteName = document.getElementById('noteName');
const noteHz = document.getElementById('noteHz');
const stringNum = document.getElementById('stringNum');

function renderStrings() {
  stringsGroup.innerHTML = '';
  pegsGroup.innerHTML = '';
  const kignit = KIGNITS[activeKignit];

  for (let i = 0; i < STRING_COUNT; i++) {
    const tx = getStringX(i, true);
    const bx = getStringX(i, false);
    const thickness = 0.9 + (1 - i / STRING_COUNT) * 1.4; // lower strings thicker

    // Tuning peg
    const pegX = tx - 4;
    const peg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    peg.setAttribute('x', pegX); peg.setAttribute('y', '100');
    peg.setAttribute('width', '8'); peg.setAttribute('height', '14');
    peg.setAttribute('rx', '2');
    peg.setAttribute('fill', '#c8a060');
    peg.setAttribute('stroke', '#5c2e0e');
    peg.setAttribute('stroke-width', '0.5');
    pegsGroup.appendChild(peg);

    // String shadow
    const shadow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    shadow.setAttribute('x1', tx + 1.5); shadow.setAttribute('y1', topY);
    shadow.setAttribute('x2', bx + 1.5); shadow.setAttribute('y2', botY);
    shadow.setAttribute('stroke', 'rgba(0,0,0,0.35)');
    shadow.setAttribute('stroke-width', thickness + 1);
    stringsGroup.appendChild(shadow);

    // String group (hit zone)
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'string-hit');
    g.setAttribute('data-index', i);

    // Invisible wide hit zone
    const hitZone = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    hitZone.setAttribute('x1', tx); hitZone.setAttribute('y1', topY - 10);
    hitZone.setAttribute('x2', bx); hitZone.setAttribute('y2', botY + 10);
    hitZone.setAttribute('stroke', 'transparent');
    hitZone.setAttribute('stroke-width', '22');

    // Visible string
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('class', 'string-line');
    line.setAttribute('x1', tx); line.setAttribute('y1', topY);
    line.setAttribute('x2', bx); line.setAttribute('y2', botY);
    line.setAttribute('stroke', `rgba(${180 + i*6}, ${150 + i*4}, ${90 + i*3}, 0.88)`);
    line.setAttribute('stroke-width', thickness);
    line.setAttribute('stroke-linecap', 'round');

    g.appendChild(hitZone);
    g.appendChild(line);
    stringsGroup.appendChild(g);

    // Events
    function onPluck(e) {
      e.preventDefault();
      pluckString(i, tx, bx, line, kignit.notes[i]);
    }
    g.addEventListener('mousedown', onPluck);
    g.addEventListener('touchstart', onPluck, { passive: false });
  }
}

function pluckString(i, tx, bx, lineEl, noteData) {
  // Play audio
  playString(noteData.hz, i);

  // Visual: string glow
  lineEl.setAttribute('stroke', '#f0d090');
  lineEl.setAttribute('filter', 'url(#strGlow)');
  lineEl.setAttribute('stroke-width', 2.5);
  setTimeout(() => {
    const t = i / (STRING_COUNT - 1);
    lineEl.setAttribute('stroke', `rgba(${180 + i*6}, ${150 + i*4}, ${90 + i*3}, 0.88)`);
    lineEl.removeAttribute('filter');
    lineEl.setAttribute('stroke-width', 0.9 + (1 - i / STRING_COUNT) * 1.4);
  }, 350);

  // Ripple at pluck point (midway up string)
  addRipple(tx * 0.35 + bx * 0.65, topY + (botY - topY) * 0.45);

  // Note display
  noteName.textContent = noteData.note;
  noteHz.textContent = noteData.hz.toFixed(1) + ' Hz';
  stringNum.textContent = `String ${i + 1}`;
  noteDisplay.classList.add('show');
  clearTimeout(noteTimeout);
  noteTimeout = setTimeout(() => noteDisplay.classList.remove('show'), 1800);
}

function addRipple(x, y) {
  const wrap = document.getElementById('rippleContainer');
  const svgEl = document.getElementById('begena-svg');
  const rect = svgEl.getBoundingClientRect();
  const vbW = 340, vbH = 760;
  const scaleX = rect.width / vbW;
  const scaleY = rect.height / vbH;
  const px = rect.left + x * scaleX;
  const py = rect.top + y * scaleY;
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = (px - rect.left) + 'px';
  r.style.top  = (py - rect.top)  + 'px';
  wrap.appendChild(r);
  setTimeout(() => r.remove(), 700);
}

// ── Kignit switching ─────────────────────────────────────────────────────────
document.getElementById('kignitBar').addEventListener('click', e => {
  const btn = e.target.closest('.kignit-btn');
  if (!btn) return;
  document.querySelectorAll('.kignit-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeKignit = btn.dataset.kignit;
  renderStrings();
});

// ── Init ─────────────────────────────────────────────────────────────────────
renderStrings();
</script>
